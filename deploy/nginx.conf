# ---------- Development alternative: proxy API langsung di port 80 ----------
# Jika belum punya domain, komentari server blok di atas dan aktifkan blok ini
# agar API tetap bisa diakses via HTTP di port 80 selama tahap development.
server {
    listen 8000;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    location /uploads/ {
        alias /data/uploads/;
    }
}
