# =============================================================================
# Fruit POS - Nginx Reverse Proxy
#
# Mode:
#   - Port 80  selalu proksi HTTP (untuk inception Let's Encrypt & fallback)
#   - Port 443 diaktifkan otomatis setelah certificate ada di
#     /etc/letsencrypt/live/<YOUR_DOMAIN>/
#
# Penggunaan HTTPS (opsional, tanpa domain bisa pakai self-signed):
#   1. Ganti <YOUR_DOMAIN> pada server block 443 di bawah dengan domain Anda.
#   2. Jalankan certbot (lihat deploy/setup_server.sh).
# =============================================================================

# ---------- HTTP (always available, used for ACME challenge + redirect) ----------
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Redirect ke HTTPS jika certificate sudah tersedia
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (aktif setelah sertifikat dipasang) ----------
# Hapus komentar pada blok ini setelah menjalankan certbot dan mengganti DOMAIN.
