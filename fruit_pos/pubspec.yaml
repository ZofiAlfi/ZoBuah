name: fruit_pos
description: "Fruit POS - Aplikasi penjualan dan manajemen toko buah online/offline"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.0.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  uuid: ^4.4.2
  image_picker: ^1.1.2
  image: ^4.2.0
  crypto: ^3.0.3
  device_info_plus: ^10.1.2

dev_dependencies:
    flutter_test:
      sdk: flutter
    integration_test:
      sdk: flutter
    flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png